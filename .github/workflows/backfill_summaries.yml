name: Backfill order summaries

on:
  workflow_dispatch:
    inputs:
      table:
        description: "Which corpus"
        required: true
        type: choice
        options: [cerc_orders, aptel_orders]
      limit:
        description: "Max rows this run (blank = all remaining)"
        required: false
        default: ""

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # under GitHub's 6h cap; the job is resumable anyway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Cache MiniLM weights so reruns skip the ~90MB HuggingFace download
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: minilm-l6-v2

      - run: pip install psycopg2-binary sentence-transformers numpy

      - name: Run backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ARGS="--table ${{ inputs.table }}"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python backfill_summaries.py $ARGS
