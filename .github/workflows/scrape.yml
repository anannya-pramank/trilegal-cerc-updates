name: CERC Scraper

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run scraper via Indian Proxy
        run: |
          # Fetch a fresh list of free proxies, filter for an Indian (IN) one, and pick the first working exit node
          PROXY_IP=$(curl -s "https://pubproxy.com/api/proxy?country=IN&https=true" | jq -r '.data[0].ipPort')
          
          if [ "$PROXY_IP" != "null" ] && [ ! -z "$PROXY_IP" ]; then
            echo "Routing through Indian proxy: $PROXY_IP"
            export HTTPS_PROXY="http://$PROXY_IP"
            export HTTP_PROXY="http://$PROXY_IP"
          else
            echo "Warning: No free Indian proxy fetched, trying direct connection..."
          fi
          
          python scrapers/cerc_scraper.py

      - name: Commit updated JSON
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add cerc/cerc_new.json
          git diff --staged --quiet || git commit -m "CERC update $(date +'%Y-%m-%d')"
          git push
