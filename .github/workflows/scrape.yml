name: CERC Scraper

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run scraper via Indian Proxy
        run: |
          echo "Fetching bulk list of free Indian HTTP proxies..."
          # Pull a list of Indian proxies from ProxyScrape
          PROXY_LIST=$(curl -s "https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=10000&country=IN")
          
          WORKING_PROXY=""
          
          # Loop through the list and test them
          for proxy in $PROXY_LIST; do
            # Clean up hidden carriage returns from the API response
            proxy=$(echo "$proxy" | tr -d '\r')
            
            if [ -z "$proxy" ]; then continue; fi
            
            echo "Testing proxy: $proxy..."
            # Try to hit CERC through the proxy with a strict 5-second timeout
            if curl -s -k -L --max-time 5 --proxy "http://$proxy" "https://cercind.gov.in" -o /dev/null; then
              echo "✅ Success! Found working proxy: $proxy"
              WORKING_PROXY=$proxy
              break
            else
              echo "❌ Failed or timed out."
            fi
          done
          
          if [ ! -z "$WORKING_PROXY" ]; then
            export HTTPS_PROXY="http://$WORKING_PROXY"
            export HTTP_PROXY="http://$WORKING_PROXY"
          else
            echo "⚠️ WARNING: Exhausted the proxy list and found zero working exit nodes. The scraper will likely fail."
          fi
          
          python scrapers/cerc_scraper.py

      - name: Commit updated JSON
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add cerc/cerc_new.json
          git diff --staged --quiet || git commit -m "CERC update $(date +'%Y-%m-%d')"
          git push
