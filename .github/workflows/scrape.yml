name: CERC Scraper

on:
  schedule:
    - cron: '30 2 * * *'      # daily at 02:30 UTC (08:00 IST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cerc-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'                       # cache pip downloads (torch etc.)

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface         # all-MiniLM downloaded once, reused after
          key: hf-all-minilm-l6-v2

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run scraper
        env:
          PYTHONUNBUFFERED: '1'              # stream logs live
          # Optional knobs — uncomment a line to change behaviour:
          # CERC_REQUEST_DELAY: '1.0'        # seconds between PDF downloads (default 1.0; raise if throttled)
          # CERC_DIGEST_CHARS:  '6000'       # size of the digest per item (default 6000)
          # CERC_KEEP_FULLTEXT: '1'          # also archive full text to cerc/fulltext/<id>.txt
          # CERC_MAX_ORDERS:    '1'          # only process the newest N new orders (0 = all)
          # CERC_MAX_REGS:      '0'
          # CERC_SEED:          '1'          # record current IDs as seen, download nothing (run once)
          # CERC_ORDERS_YEAR:   '2025'       # scrape a past-year archive instead of the live page
        run: python scrapers/cerc_scraper.py

      - name: Load into Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          [ -z "$DATABASE_URL" ] && echo "No DATABASE_URL secret set; skipping load." && exit 0
          [ -f cerc/cerc_orders_new.json ] || { echo "No new orders file; skipping."; exit 0; }
          count=$(python -c "import json;print(json.load(open('cerc/cerc_orders_new.json'))['count'])" 2>/dev/null || echo 0)
          if [ "$count" != "0" ]; then
            echo "Loading $count orders into Supabase"
            python load_cerc.py cerc/cerc_orders_new.json
          else
            echo "No new orders; nothing to load."
          fi

      - name: Commit updated data
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add cerc/
          git diff --staged --quiet || git commit -m "CERC update $(date +'%Y-%m-%d')"
          git push

      - name: Notify Power Automate
        env:
          PA_WEBHOOK_URL: ${{ secrets.PA_WEBHOOK_URL }}
        run: |
          [ -z "$PA_WEBHOOK_URL" ] && echo "No PA_WEBHOOK_URL secret set; skipping." && exit 0
          for f in cerc/cerc_orders_new.json cerc/cerc_regs_new.json; do
            [ -f "$f" ] || continue
            count=$(python -c "import json;print(json.load(open('$f'))['count'])" 2>/dev/null || echo 0)
            if [ "$count" != "0" ]; then
              echo "Posting $count items from $f to Power Automate"
              curl -sS -X POST -H 'Content-Type: application/json' --data @"$f" "$PA_WEBHOOK_URL"
            else
              echo "$f has no new items; nothing to send."
            fi
          done
