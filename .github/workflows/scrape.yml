name: CERC Scraper

on:
  schedule:
    - cron: '30 2 * * *'      # daily at 02:30 UTC (08:00 IST)
  workflow_dispatch:           # lets you run it by hand from the Actions tab

# Needed so the job can push the updated data back to the repo.
permissions:
  contents: write

# Prevent two runs (e.g. a scheduled one and a manual one) from pushing at once.
concurrency:
  group: cerc-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run scraper
        # Optional knobs — defaults are fine; uncomment `env:` and a line to change:
        # env:
        #   CERC_MAX_ORDERS: '1'   # only fetch the newest N new orders (0 = all)
        #   CERC_MAX_REGS:   '0'   # same, for regulations
        #   CERC_SEED:       '1'   # record current IDs as seen, download no PDFs (run once to skip a backlog)
        #   CERC_SEMANTIC:   '1'   # embedding-based PDF extraction (needs sentence-transformers + numpy)
        run: python scraper.py

      - name: Commit updated data
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add cerc/
          git diff --staged --quiet || git commit -m "CERC update $(date +'%Y-%m-%d')"
          git push
