name: CERC Scraper

on:
  schedule:
    - cron: '30 2 * * *'    # 2:30 AM UTC = 8:00 AM IST, daily
  workflow_dispatch:          # lets you trigger manually from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrapers/cerc_scraper.py

      - name: Commit updated JSON
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add cerc/cerc_new.json
          git diff --staged --quiet || git commit -m "CERC update $(date +'%Y-%m-%d')"
          git push
